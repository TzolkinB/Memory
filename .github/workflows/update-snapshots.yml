# Regenerate visual baseline snapshots on Linux and commit them back.
# Trigger manually via Actions → "Update Visual Snapshots" → Run workflow.
name: Update Visual Snapshots

'on':
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Regenerate Snapshots (Linux)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      HOME: /root
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Delete existing snapshots
        run: rm -rf tests/visual-smoke-baseline.spec.ts-snapshots

      - name: Generate Linux snapshots
        run: npm run test:visual:update

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual-smoke-baseline.spec.ts-snapshots/
          git diff --cached --quiet || git commit -m "chore(visual): update snapshots for Linux/CI [skip ci]"
          git push
